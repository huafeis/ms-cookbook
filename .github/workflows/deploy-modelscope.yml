name: Deploy to ModelScope Studio

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'favicon.svg'
      - 'assets/**'
      - 'content/**'
      - 'CONTRIBUTING.md'
      - 'scripts/build-content.py'
      - 'scripts/check-site.mjs'
      - 'README*.md'
      - 'LICENSE'
      - 'scripts/deploy-modelscope.mjs'
      - '.github/workflows/deploy-modelscope.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modelscope-ms-cookbook
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify chapter data and local resources
        run: |
          python3 scripts/build-content.py
          git diff --exit-code -- assets/content.js
          node scripts/check-site.mjs
      - name: Sync and deploy the website
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_STUDIO: canghe/ms-cookbook
        run: node scripts/deploy-modelscope.mjs
